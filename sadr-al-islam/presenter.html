<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نافذة المقدّم · عصر صدر الإسلام</title>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/fonts.css">
<style>
  :root { --forest:#0f2a20; --forest-2:#163829; --gold:#c9a85c; --gold-2:#e4c983; --ivory:#f8f3e6; --ink:#1f1b14; --soft:#4a4232; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Cairo',sans-serif; background:var(--ivory); color:var(--ink); line-height:1.9; }
  header { position:sticky; top:0; z-index:2; display:flex; flex-wrap:wrap; align-items:center; gap:12px; justify-content:space-between; padding:12px 20px; background:var(--forest); color:var(--gold-2); }
  h1 { margin:0; font-family:'Amiri',serif; font-size:1.3rem; }
  .ctrl { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  button { font:inherit; cursor:pointer; min-height:42px; padding:0 16px; border-radius:999px; border:1px solid var(--gold); background:transparent; color:var(--gold-2); font-weight:700; }
  button.primary { background:var(--gold); color:var(--forest); }
  button:disabled { opacity:.35; cursor:default; }
  button:focus-visible { outline:3px solid #fff; outline-offset:2px; }
  .timer { font-variant-numeric:tabular-nums; font-weight:800; color:#fff; min-width:70px; text-align:center; direction:ltr; }
  .status { font-size:.8rem; color:#cfc5ad; }
  main { display:grid; grid-template-columns: 1fr 280px; gap:24px; padding:22px; max-width:1200px; margin:0 auto; }
  .cur-n { display:inline-block; padding:2px 14px; border-radius:999px; background:var(--forest); color:var(--gold-2); font-weight:800; }
  h2 { font-family:'Amiri',serif; font-size:2rem; margin:6px 0 4px; color:var(--forest); }
  .time { color:var(--soft); font-weight:700; font-size:.9rem; }
  h3 { color:#7a5a1c; font-size:1rem; margin:18px 0 6px; }
  .script p { font-size:1.25rem; line-height:2; margin:0 0 12px; padding-right:14px; border-right:4px solid var(--gold); }
  ul { padding-right:22px; } li { margin-bottom:6px; }
  aside { background:#fff; border:1px solid #e6d8b9; border-radius:16px; padding:16px; align-self:start; position:sticky; top:86px; }
  aside h3 { margin-top:0; }
  .next-t { font-family:'Amiri',serif; font-size:1.3rem; color:var(--forest); margin:0 0 12px; }
  ol.jump { list-style:none; padding:0; margin:0; display:grid; gap:6px; }
  ol.jump button { width:100%; text-align:right; color:var(--forest); border-color:#e6d8b9; background:var(--ivory); border-radius:10px; }
  ol.jump button[aria-current] { background:var(--forest); color:var(--gold-2); border-color:var(--forest); }
  @media (max-width:820px){ main{grid-template-columns:1fr;} aside{position:static;} .script p{font-size:1.1rem;} }
</style>
</head>
<body>
<header>
  <h1>نافذة المقدّم</h1>
  <div class="ctrl">
    <button type="button" id="pPrev">→ السابق</button>
    <button type="button" class="primary" id="pNext">التالي ←</button>
    <span class="timer" id="timer" aria-label="الوقت المنقضي">00:00</span>
    <button type="button" id="tReset">تصفير المؤقت</button>
  </div>
  <p class="status" id="status" aria-live="polite">بانتظار الاتصال بالعرض الرئيسي…</p>
</header>
<main>
  <section aria-live="polite">
    <span class="cur-n" id="curN">1 / 8</span>
    <h2 id="curT"></h2>
    <p class="time" id="curTime"></p>
    <h3>النص الشفهي</h3>
    <div class="script" id="script"></div>
    <h3>تنبيهات</h3>
    <ul id="cues"></ul>
  </section>
  <aside>
    <h3>القسم التالي</h3>
    <p class="next-t" id="nextT"></p>
    <h3>انتقال مباشر</h3>
    <ol class="jump" id="jump"></ol>
  </aside>
</main>
<script src="js/notes.js"></script>
<script>
(function () {
  var S = window.SECTIONS, cur = 1, linked = false;
  var m = /^#s([1-8])$/.exec(location.hash); if (m) cur = +m[1];
  var ch = null; try { ch = new BroadcastChannel('sadr-islam'); } catch (e) {}
  var $ = function (id) { return document.getElementById(id); };

  S.forEach(function (s) {
    var li = document.createElement('li'), b = document.createElement('button');
    b.type = 'button'; b.textContent = s.n + '. ' + s.title; b.dataset.n = s.n;
    b.addEventListener('click', function () { send({ cmd: 'go', n: s.n }); show(s.n); });
    li.appendChild(b); $('jump').appendChild(li);
  });

  function show(n) {
    cur = n; var s = S[n - 1];
    $('curN').textContent = n + ' / ' + S.length;
    $('curT').textContent = s.title;
    $('curTime').textContent = 'المدة المقترحة: ' + s.time;
    $('script').innerHTML = s.script.map(function (p) { return '<p>' + p + '</p>'; }).join('');
    $('cues').innerHTML = s.cues.map(function (c) { return '<li>' + c + '</li>'; }).join('');
    $('nextT').textContent = n < S.length ? (n + 1) + '. ' + S[n].title : 'نهاية العرض';
    $('pPrev').disabled = n === 1; $('pNext').disabled = n === S.length;
    Array.prototype.forEach.call(document.querySelectorAll('#jump button'), function (b) {
      if (+b.dataset.n === n) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
    });
    document.title = n + '. ' + s.title + ' · نافذة المقدّم';
  }
  function send(o) {
    o.type = 'sadr-cmd'; o.id = Date.now() + '-' + Math.random().toString(36).slice(2);
    if (ch) try { ch.postMessage(o); } catch (e) {}
    if (window.opener && !window.opener.closed) try { window.opener.postMessage(o, '*'); } catch (e) {}
    try { o.t = Date.now(); localStorage.setItem('sadr-cmd', JSON.stringify(o)); } catch (e) {}
  }
  function onSync(d) {
    if (!d || d.type !== 'sadr-sync') return;
    if (!linked) { linked = true; $('status').textContent = 'متصل بالعرض الرئيسي ✓'; }
    show(d.n);
  }
  if (ch) ch.onmessage = function (e) { onSync(e.data); };
  window.addEventListener('message', function (e) { onSync(e.data); });
  window.addEventListener('storage', function (e) { if (e.key === 'sadr-current' && e.newValue) onSync({ type: 'sadr-sync', n: +e.newValue }); });

  function go(d) { var n = Math.max(1, Math.min(S.length, cur + d)); send({ cmd: d > 0 ? 'next' : 'prev' }); show(n); }
  $('pNext').addEventListener('click', function () { go(1); });
  $('pPrev').addEventListener('click', function () { go(-1); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'PageDown') { e.preventDefault(); go(1); }
    if (e.key === 'ArrowRight' || e.key === 'PageUp') { e.preventDefault(); go(-1); }
  });

  var t0 = Date.now();
  setInterval(function () {
    var s = Math.floor((Date.now() - t0) / 1000);
    $('timer').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }, 500);
  $('tReset').addEventListener('click', function () { t0 = Date.now(); });

  try { var saved = +localStorage.getItem('sadr-current'); if (!m && saved >= 1 && saved <= 8) cur = saved; } catch (e) {}
  show(cur);
  send({ cmd: 'hello' });
})();
</script>
</body>
</html>
